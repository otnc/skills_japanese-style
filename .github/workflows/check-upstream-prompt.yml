name: check upstream prompt

on:
  schedule:
    - cron: '0 20 * * 1'
      timezone: Asia/Tokyo

permissions:
  contents: read
  issues: write

concurrency:
  group: check-upstream-prompt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-upstream-prompt.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
